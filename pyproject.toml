[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cma-yield-curve"
version = "0.1.0"
description = "Auditable inputs for US CMA yield curve projections"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.24"]

[project.optional-dependencies]
bloomberg = ["xbbg>=0.7.7"]

[tool.setuptools.packages.find]
include = ["cma_curve*"]
